name: flutter_gql_acsys
description: "Flutter interface to the ACSys GraphQL API"
version: 1.1.0
publish_to: none
homepage: https://github.com/fermi-ad/flutter-gql-acsys

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_controls_auth:
    git:
      url: https://github.com/fermi-ad/flutter-controls-auth.git
      tag_pattern: v{{version}}
    version: ^0.8.0

  dart_gql_acsys:
    git:
      url: https://github.com/fermi-ad/dart-gql-acsys.git
      tag_pattern: v{{version}}
    version: ^1.5.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter: